global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/TOKEN/BOTTOKEN/SECRET'

route:
  group_by: ['alertname', 'contract_id', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 1m
      repeat_interval: 4h
    - match:
        alertname: 'AnomalyDetected'
      receiver: 'anomaly-webhook'
      group_wait: 30s 