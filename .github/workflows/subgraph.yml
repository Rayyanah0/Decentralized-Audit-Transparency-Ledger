name: Subgraph CI

on:
  push:
    paths: ['subgraph/**', '.github/workflows/subgraph.yml']
  pull_request:
    paths: ['subgraph/**', '.github/workflows/subgraph.yml']
  workflow_dispatch:

env:
  CARGO_TERMINAL_DISABLE: true

jobs:
  build-and-test:
    name: Build & Test Subgraph
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subgraph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npom'
          cache-dependency-path: 'subgraph/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Codegen
        run: npm run codegen

      - name: Build subgraph
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: subgraph-build
          path: subgraph/build

  deploy:
    name: Deploy to The Graph Hosted Service
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subgraph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'subgraph/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Codegen
        run: npm run codegen

      - name : Deploy
        if: ${ secrets.GRAPH_DEPLOY_KEY != '' }
        env:
          GRAPH_DEPLOY_KEY: ${{ secrets.GRAPH_DEPLOY_KEY }}
          GRAPH_SUBGRAPH_NAME: ${{ secrets.GRAPH_SUBGRAPH_NAME }}
        run: |
          graph auth "$GRAPH_DEPLOY_KEY"
          graph deploy \
            --subgraph "$GRAPH_SUBGRAPH_NAME" \
            --node https://api.thegraph.com/ \
            --ip-fs https://api.thegraph.com/ipfs \
            --access-token "$GRAPH_DEPLOY_KEY"
