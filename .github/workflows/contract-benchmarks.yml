name: Contract benchmarks

# Contract performance benchmarking with automated regression detection (#406).
#
# The suite measures every entry point's Soroban resource usage (instructions,
# fee, ledger read/write entries), the contract WASM artifact size, and the
# host's memory footprint. The resource numbers come from the Soroban host's
# invocation metering, so they are deterministic: two runs of the same commit
# produce identical values, which is what makes a tight 5% gate meaningful
# instead of noise-prone. Wall-clock timings are recorded but deliberately not
# gated, because they depend on the runner rather than on the contract.
#
# Two triggers:
#   * every PR touching the contract, the suite or the tooling — the gate runs
#   * weekly on a schedule — the full run plus a committed history snapshot,
#     which is what the Grafana trend view is built from
#
# Baselines are promoted deliberately (`--update-baseline` on the weekly job, or
# locally), never automatically: a baseline that moves whenever a run regresses
# cannot detect a regression.

permissions: {}

on:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'scripts/bench/**'
      - 'benchmarks/baseline.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contract-benchmarks.yml'
  schedule:
    # Weekly, Mondays at 04:17 UTC. Off the hour to avoid the top-of-hour rush
    # that delays every scheduled workflow on GitHub.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Promote this run to the committed baseline
        type: boolean
        default: false
      threshold:
        description: Regression threshold in percent
        type: string
        default: '5'

concurrency:
  group: contract-benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Keep the report paths anchored at the repository root regardless of the
  # package directory cargo chooses as the benchmark working directory.
  BENCH_REPO_ROOT: ${{ github.workspace }}

jobs:
  regression:
    name: Regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the harness can stamp the report with the real
          # commit, and so a scheduled run can push a history snapshot.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-

      - name: Add WASM target
        run: rustup target add wasm32v1-none

      - name: Run benchmarks and detect regressions
        id: detect
        run: |
          # `--github-annotations` is added automatically by the runner when it
          # detects GITHUB_ACTIONS, so it is deliberately not passed here.
          args=(--threshold "${{ inputs.threshold || '5' }}")
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            args+=(--update-baseline)
          fi
          scripts/bench/run_benchmarks.sh "${args[@]}"

      - name: Publish the regression summary
        if: always()
        run: |
          {
            echo "## Contract benchmark regression gate"
            echo
            if [ -f benchmarks/results/regression.md ]; then
              cat benchmarks/results/regression.md
            else
              echo "_The regression step did not produce a summary._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Record the verdict
        if: always()
        run: |
          if [ -f benchmarks/results/regression-summary.json ]; then
            cat benchmarks/results/regression-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

  history:
    name: Historical snapshot
    # Only the weekly/manual run archives a snapshot: a per-PR snapshot would
    # bury the trend in one-off commits and the archive is meant to answer
    # "which release got slower", which only a dated, deliberate series can.
    #
    # `always()` is deliberate: the snapshot is most valuable exactly when the
    # gate fails, because that is the run you will want to compare against
    # later. A detected regression must not cost us the evidence.
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download the benchmark report
        uses: actions/download-artifact@v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: benchmarks/results

      - name: Commit the dated snapshot
        run: |
          set -euo pipefail
          REPORT="benchmarks/results/benchmark-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "::error::no benchmark report was produced; skipping the snapshot"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%d)"
          SNAPSHOT="benchmarks/history/$STAMP.json"
          mkdir -p benchmarks/history
          cp "$REPORT" "$SNAPSHOT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT"
          if git diff --cached --quiet; then
            echo "the benchmark snapshot is unchanged since the last run today"
            exit 0
          fi
          git commit -m "chore(bench): record contract benchmark snapshot for $STAMP"
          git push

      - name: Upload the history series
        if: always()
        run: |
          scripts/bench/prometheus_exposition.py \
            --history benchmarks/history \
            --out benchmarks/history.prom
          cat benchmarks/history.prom >> "$GITHUB_STEP_SUMMARY"
