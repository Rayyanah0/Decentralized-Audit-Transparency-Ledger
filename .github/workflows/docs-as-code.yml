name: Docs-as-Code Quality & Deployment

on:
  push:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - '*.md'
      - '.markdownlint.json'
      - '.cspell.json'
      - 'mkdocs.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - '*.md'
      - '.markdownlint.json'
      - '.cspell.json'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  validate-docs:
    name: Markdown, Links, Spelling & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Markdownlint CLI & CSpell
        run: |
          npm install -g markdownlint-cli cspell

      - name: Markdown Linting
        run: |
          markdownlint "docs/**/*.md" "README.md" "CONTRIBUTING.md" --config .markdownlint.json --ignore-path .markdownlintignore || true

      - name: Spell Checking
        run: |
          chmod +x scripts/docs/check-spelling.sh
          ./scripts/docs/check-spelling.sh

      - name: Link Validation
        run: |
          chmod +x scripts/docs/check-links.sh
          ./scripts/docs/check-links.sh

      - name: Contract Event Schema Validation
        run: |
          python3 scripts/docs/validate-event-docs.py

  build-and-deploy-docs:
    name: Multi-Version Docs Build & Deployment
    runs-on: ubuntu-latest
    needs: validate-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material & Mike
        run: |
          pip install mkdocs-material mike

      - name: Build Multi-Version Docs
        run: |
          chmod +x scripts/docs/build-multiversion.sh
          ./scripts/docs/build-multiversion.sh

      - name: Upload Docs Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

name: Docs-as-Code Quality & Deployment

on:
  push:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - '*.md'
      - '.markdownlint.json'
      - '.cspell.json'
      - 'mkdocs.yml'
      - 'api/**'
      - 'sdk/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - '*.md'
      - '.markdownlint.json'
      - '.cspell.json'
      - 'mkdocs.yml'
      - 'api/**'
      - 'sdk/**'
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  validate-docs:
    name: Markdown, Links, Spelling & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Markdownlint CLI & CSpell
        run: |
          npm install -g markdownlint-cli cspell

      - name: Markdown Linting
        run: |
          markdownlint "docs/**/*.md" "README.md" "CONTRIBUTING.md" --config .markdownlint.json --ignore-path .markdownlintignore || true

      - name: Spell Checking
        run: |
          chmod +x scripts/docs/check-spelling.sh
          ./scripts/docs/check-spelling.sh

      - name: Link Validation
        run: |
          chmod +x scripts/docs/check-links.sh
          ./scripts/docs/check-links.sh

      - name: Contract Event Schema Validation
        run: |
          python3 scripts/docs/validate-event-docs.py

  generate-api-docs:
    name: Generate OpenAPI, GraphQL & WebSocket Docs
    runs-on: ubuntu-latest
    needs: validate-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install codegen tooling
        run: |
          npm install -g @redocly/cli @apidevtools/swagger-cli
          pip install openapi-spec-validator graphql-core

      - name: Validate OpenAPI 3.1 spec
        run: |
          if [ -f api/openapi.yaml ]; then
            openapi-spec-validator api/openapi.yaml
          fi

      - name: Generate OpenAPI docs (Redoc)
        run: |
          if [ -f api/openapi.yaml ]; then
            mkdir -p docs/api/rest
            npx @redocly/cli build-docs api/openapi.yaml -o docs/api/rest/index.html
          fi

      - name: Generate GraphQL schema docs
        run: |
          if [ -d api/graphql ]; then
            chmod +x scripts/docs/generate-graphql-docs.sh || true
            ./scripts/docs/generate-graphql-docs.sh || true
          fi

      - name: Generate WebSocket API docs
        run: |
          if [ -d api/ws ]; then
            chmod +x scripts/docs/generate-ws-docs.sh || true
            ./scripts/docs/generate-ws-docs.sh || true
          fi

      - name: Generate SDK code examples
        run: |
          chmod +x scripts/docs/generate-sdk-examples.sh || true
          ./scripts/docs/generate-sdk-examples.sh || true

      - name: Upload generated API docs
        uses: actions/upload-artifact@v4
        with:
          name: generated-api-docs
          path: docs/api/
          retention-days: 30

  build-and-deploy-docs:
    name: Multi-Version Docs Build & Deployment
    runs-on: ubuntu-latest
    needs: [validate-docs, generate-api-docs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material & Mike
        run: |
          pip install mkdocs-material mike

      - name: Download generated API docs
        uses: actions/download-artifact@v4
        with:
          name: generated-api-docs
          path: docs/api/

      - name: Build Multi-Version Docs
        run: |
          chmod +x scripts/docs/build-multiversion.sh
          ./scripts/docs/build-multiversion.sh

      - name: Upload Docs Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

  deploy-docs:
    name: Deploy Versioned Docs
    runs-on: ubuntu-latest
    needs: build-and-deploy-docs
    if: github.event_name == 'release' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material & Mike
        run: |
          pip install mkdocs-material mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs with Mike
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest