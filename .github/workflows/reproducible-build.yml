name: Reproducible WASM Build

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  packages: write

on:
  pull_request:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  reproducible-wasm:
    name: Reproducible WASM build (dual independent builds)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Install cargo-audit and cargo-cyclonedx
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-cyclonedx --locked

      # First build
      - name: Build WASM (first pass)
        run: |
          cargo clean
          cargo build --target wasm32v1-none --release --locked

      - name: Compute SHA-256 (first pass)
        id: hash1
        run: |
          WASM_FILE="target/wasm32v1-none/release/audit_ledger.wasm"
          SHA256=$(sha256sum "$WASM_FILE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "First build WASM SHA-256: $SHA256"
          cp "$WASM_FILE" /tmp/audit_ledger_build1.wasm

      # Second independent build
      - name: Build WASM (second pass)
        run: |
          cargo clean
          cargo build --target wasm32v1-none --release --locked

      - name: Compute SHA-256 (second pass)
        id: hash2
        run: |
          WASM_FILE="target/wasm32v1-none/release/audit_ledger.wasm"
          SHA256=$(sha256sum "$WASM_FILE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Second build WASM SHA-256: $SHA256"
          cp "$WASM_FILE" /tmp/audit_ledger_build2.wasm

      - name: Verify builds are identical
        run: |
          SHA1="${{ steps.hash1.outputs.sha256 }}"
          SHA2="${{ steps.hash2.outputs.sha256 }}"
          echo "Build 1: $SHA1"
          echo "Build 2: $SHA2"
          if [ "$SHA1" != "$SHA2" ]; then
            echo "ERROR: Builds are NOT reproducible! SHA-256 hashes differ."
            diff <(xxd /tmp/audit_ledger_build1.wasm) <(xxd /tmp/audit_ledger_build2.wasm) | head -50 || true
            exit 1
          fi
          echo "SUCCESS: Both builds produced identical WASM binaries."

      - name: Run cargo-audit (dependency vulnerability scan)
        run: |
          cargo audit --json > cargo-audit-report.json || true
          cargo audit

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo cyclonedx --format json --output-cdx sbom-cyclonedx.json
          cargo cyclonedx --format xml --output-cdx sbom-cyclonedx.xml

      - name: Save SHA-256
        run: |
          echo "${{ steps.hash1.outputs.sha256 }}" > wasm-sha256.txt
          cat wasm-sha256.txt

      - name: Upload SHA-256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-sha256
          path: wasm-sha256.txt
          retention-days: 30

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit_ledger.wasm
          path: target/wasm32v1-none/release/audit_ledger.wasm
          retention-days: 30

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          retention-days: 30

      - name: Upload cargo-audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          retention-days: 30

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign WASM artifact with cosign (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature audit_ledger.wasm.sig \
            --output-certificate audit_ledger.wasm.pem \
            target/wasm32v1-none/release/audit_ledger.wasm

      - name: Upload cosign signature and certificate
        uses: actions/upload-artifact@v4
        with:
          name: wasm-signature
          path: |
            audit_ledger.wasm.sig
            audit_ledger.wasm.pem
          retention-days: 30

      - name: Generate build provenance attestation (in-toto / SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/wasm32v1-none/release/audit_ledger.wasm

      - name: Post SHA-256 as job summary
        run: |
          echo "## WASM Binary Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Git Commit**: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Rust Version**: 1.85.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reproducibility**: ✅ Both independent builds matched" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat wasm-sha256.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Instructions for verification**:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Clone the repository at commit $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Install Rust 1.85.0: \`rustup install 1.85.0\`" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Build locally: \`cargo build --target wasm32v1-none --release --locked\`" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Verify: \`sha256sum target/wasm32v1-none/release/audit_ledger.wasm\`" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Compare with hash above" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Supply chain security**:" >> "$GITHUB_STEP_SUMMARY"
          echo "- SBOM (CycloneDX): \`sbom-cyclonedx.json\`, \`sbom-cyclonedx.xml\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature: \`audit_ledger.wasm.sig\` + \`audit_ledger.wasm.pem\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verify signature: \`cosign verify-blob --certificate audit_ledger.wasm.pem --signature audit_ledger.wasm.sig target/wasm32v1-none/release/audit_ledger.wasm\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verify provenance: \`gh attestation verify target/wasm32v1-none/release/audit_ledger.wasm --repo \$GITHUB_REPOSITORY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency audit: see \`cargo-audit-report.json\` artifact" >> "$GITHUB_STEP_SUMMARY"
