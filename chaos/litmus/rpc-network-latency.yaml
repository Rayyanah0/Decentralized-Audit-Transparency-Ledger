apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: rpc-network-latency-chaos
  namespace: audit-ledger
spec:
  appinfo:
    appns: audit-ledger
    applabel: app.kubernetes.io/name=stellar-rpc-proxy
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-latency
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: NETWORK_LATENCY
              value: "4000"
            - name: JITTER
              value: "500"
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"
