apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-relayer-ha
  namespace: bridge-system
  labels:
    app.kubernetes.io/name: bridge-relayer
    app.kubernetes.io/component: relayer
    app.kubernetes.io/part-of: auditledger
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bridge-relayer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridge-relayer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bridge-relayer-ha-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - bridge-relayer
                topologyKey: kubernetes.io/hostname
      containers:
        - name: relayer
          image: ghcr.io/daddygokings-art/bridge-relayer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LEASE_DURATION_MS
              value: "5000"
            - name: RENEW_INTERVAL_MS
              value: "2000"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
