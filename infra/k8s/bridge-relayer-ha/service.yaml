apiVersion: v1
kind: Service
metadata:
  name: bridge-relayer-ha-service
  namespace: bridge-system
  labels:
    app.kubernetes.io/name: bridge-relayer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bridge-relayer
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-relayer-ha-leader
  namespace: bridge-system
  labels:
    app.kubernetes.io/name: bridge-relayer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bridge-relayer
    role: leader
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
